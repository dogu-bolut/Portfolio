[package]
name = "dogubolut-portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_meta = "0.8"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlVideoElement", "HtmlImageElement", "HtmlLiElement", "HtmlDivElement",
  "DomRect", "DomTokenList", "MouseEvent", "KeyboardEvent", "Node", "NodeList",
  "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "ScrollToOptions",
  "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
  "CssStyleDeclaration", "MediaQueryList", "Storage"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
